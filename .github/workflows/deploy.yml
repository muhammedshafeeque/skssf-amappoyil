name: Deploy

# Deploys rules, functions and the admin web to the dev project after CI passes on main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service account with
# Firebase Admin + Cloud Functions Admin + Service Account User roles). Skips when unset.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip when no service account is configured
        if: env.HAS_SA != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set — skipping deploy."

      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        if: env.HAS_SA == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: env.HAS_SA == 'true'
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: google-github-actions/auth@v2
        if: env.HAS_SA == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: env.HAS_SA == 'true'
        run: npx -y firebase-tools@15 deploy --project dev --only firestore,storage,functions,hosting --force --non-interactive
