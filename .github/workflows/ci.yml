name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: node ../scripts/sync-shared.mjs --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install -g firebase-tools@15 && npm run test:emulators

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: skssf-amp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: skssf-amp/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir /tmp/bundle
